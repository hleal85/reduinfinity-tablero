const ITER = 310000;

async function descifrar(pass){
  const raw = Uint8Array.from(atob(B64), c=>c.charCodeAt(0));
  if(String.fromCharCode(...raw.slice(0,8)) !== "Salted__") throw new Error("formato");
  const sal = raw.slice(8,16), datos = raw.slice(16);
  const matPass = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
    "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2", salt:sal, iterations:ITER, hash:"SHA-256"}, matPass, 48*8));
  const llave = await crypto.subtle.importKey("raw", bits.slice(0,32),
    {name:"AES-CBC"}, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({name:"AES-CBC", iv:bits.slice(32,48)},
    llave, datos);
  return new TextDecoder().decode(plano);
}

async function intentar(pass){
  if(!pass) return;
  try{
    const html = await descifrar(pass);
    try{ localStorage.setItem("ri_pin","5090"); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    const err = document.getElementById("err");
    if(err){ err.style.visibility="visible"; document.getElementById("clave").value=""; }
  }
}

document.getElementById("btn").addEventListener("click", ()=>intentar(document.getElementById("clave").value));
document.getElementById("clave").addEventListener("keydown", e=>{
  if(e.key==="Enter") intentar(e.target.value);
});
if(location.hash.length>1) intentar(decodeURIComponent(location.hash.slice(1)));
setTimeout(()=>document.getElementById("clave").focus(),100);
</script>
